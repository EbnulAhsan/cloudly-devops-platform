apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: node-react-postgres-platform-backend:latest
          imagePullPolicy: IfNotPresent  
          ports:
            - containerPort: 4000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "devuser"
            - name: DB_PASSWORD
              value: "devpassword"
            - name: DB_NAME
              value: "appdb"
            - name: PORT
              value: "4000"
            
            # Platform Services & DB Read/Write Simulation (Task 5)
            - name: DB_WRITE_URL
              value: "postgres://devuser:devpassword@postgres:5432/appdb"
            - name: DB_READ_URL
              value: "postgres://devuser:devpassword@postgres:5432/appdb"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq-service:5672"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch-service:9200"
          
          # Added for HPA (Task 6)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
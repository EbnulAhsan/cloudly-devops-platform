apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullmq-worker
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: bullmq-worker }
  template:
    metadata:
      labels: { app: bullmq-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/node-react-postgres-backend:latest
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }

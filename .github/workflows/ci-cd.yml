name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "pre-release/v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back (leave empty to skip)"
        required: false

env:
  IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/node-react-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/node-react-frontend

jobs:
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and target namespace
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "${GITHUB_REF_NAME}" in
            main) echo "namespace=dev" >> "$GITHUB_OUTPUT" ;;
            pre-release/v*) echo "namespace=preprod" >> "$GITHUB_OUTPUT" ;;
            release/v*) echo "namespace=release" >> "$GITHUB_OUTPUT" ;;
            *) echo "namespace=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.namespace }}-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.namespace }}-latest

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      - name: Simulated Deployment
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          echo "In a real cluster, we would authenticate using KUBECONFIG and run the following:"
          echo "sed -i 's|image: node-react-postgres-platform-backend:latest|image: ${{ env.IMAGE_BACKEND }}:${TAG}|g' k8s/backend.yaml"
          echo "kubectl apply -n ${NAMESPACE} -f k8s/"
          echo "Successfully updated manifests for namespace: ${NAMESPACE} with tag: ${TAG}"